# Render Blueprint for CurePacket.
# Dashboard: New → Blueprint → select this GitHub repository.
# See DEPLOY.md for the click-by-click version.

databases:
  - name: curepacket-db
    plan: basic-256mb
    region: oregon
    databaseName: curepacket
    user: curepacket
    postgresMajorVersion: "16"
    # Private network only. The web service connects with the internal URL.
    ipAllowList: []

services:
  - type: web
    name: curepacket
    runtime: docker
    plan: standard
    region: oregon
    branch: main
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations run again on container start. This step fails the deploy if they fail,
    # before Render sends traffic to the new instance.
    preDeployCommand: node scripts/migrate.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curepacket-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NODE_ENV
        value: production
      # First deploy includes the demo agency so the owner can sign in immediately.
      # Set this to false in the dashboard after creating a real account. See DEPLOY.md.
      - key: SEED_DEMO
        value: "true"
      # AUTH_URL, APP_URL, and NEXT_PUBLIC_APP_URL are filled in automatically when the
      # container starts: Render sets RENDER_EXTERNAL_URL (https://curepacket.onrender.com)
      # and scripts/start.mjs copies it. Do not add them here — a service cannot reference
      # its own URL in a Blueprint without a circular dependency.
      # After you attach a custom domain, set AUTH_URL and APP_URL to that https URL
      # in the Render dashboard (Environment). See DEPLOY.md.

  # Monthly rescan of sites with an active monitoring subscription.
  # Same image as the website so Chromium is available. Billed only while the job runs.
  - type: cron
    name: curepacket-monitor
    runtime: docker
    plan: standard
    region: oregon
    branch: main
    schedule: "0 14 1 * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/monitor-cron.mjs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: curepacket-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_NO_SANDBOX
        value: "1"
      - key: SEED_DEMO
        value: "false"
